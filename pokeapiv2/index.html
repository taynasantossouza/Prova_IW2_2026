<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Pokemon</title>
    <link rel="stylesheet" href="style.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <section>
     <div>
        <h4>API Pokemon:</h4>
        <label for="pokemon">Nome ou ID do Pokemon</label>
        <input id="pokemon" type="text">
        <button id="poke-button">Buscar</button>
        <h5>Pokemon:</h5>
        <div class="poke-img-container">
        <img src="" alt="Pokemon" id="poke-img">
        </div>
        <div class="poke-info">
        <p id="poke-name"></p>
        <p id="poke-id"></p>
        <p id="poke-height"></p>
        <p id="poke-weight"></p>
        <p id="poke-type"></p>
        </div>
        <button id="poke-Sound">🔊 Ouvir Pokémon</button>

     </div>
   
    </section>
    <script src="script.js"></script>
</body>
</html>
